        label: "Phone, email, address and hours"
        file: "data/settings.json"
        description: "These appear at the bottom of every page and on the contact page. Change them once here and they change everywhere."
        fields:
          - { name: phone,     label: "Phone number as people read it", widget: string, hint: "For example (09) 622 2108" }
